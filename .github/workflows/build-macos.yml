name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build .app and .dmg
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ADB-Toolkit-macOS
          path: dist/ADB-Toolkit-macOS.dmg
      - name: Attach the dmg to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ADB-Toolkit-macOS.dmg --title "$GITHUB_REF_NAME" --generate-notes
